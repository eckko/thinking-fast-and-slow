<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Recall Quiz</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#dcdcd4;--acc:#1f5fbf;--ok:#1c7a3d;--bad:#b3261e;--warn:#9a6b00}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecece6;--mut:#a0a09a;--card:#1f1f1c;--line:#35352f;--acc:#7fb0ff;--ok:#5fd08a;--bad:#ff8a80;--warn:#e8b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:2px}
select,button,textarea{font:inherit;color:var(--fg)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:140px}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#101010}}
.meta{font-size:.8rem;color:var(--mut);margin-bottom:6px}
.q{font-size:1.1rem;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.reveal{border-left:3px solid var(--acc);padding:6px 12px;margin:12px 0;white-space:pre-wrap}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate .miss{border-color:var(--bad)}.rate .part{border-color:var(--warn)}.rate .got{border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.note{font-size:.85rem;color:var(--mut)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1 id="title">Recall Quiz</h1>
  <p class="sub" id="sub"></p>

  <div class="card" id="setup">
    <div class="row">
      <div><label for="scope">Scope</label><select id="scope"></select></div>
      <div><label for="mode">Practise</label>
        <select id="mode">
          <option value="due">Due and new</option>
          <option value="weak">My weak items</option>
          <option value="all">Everything</option>
        </select></div>
      <div><label for="count">Questions</label>
        <select id="count"><option>5</option><option selected>10</option><option>20</option><option value="0">All</option></select></div>
      <button class="primary" id="start">Start</button>
    </div>
    <p class="note" id="storeNote"></p>
  </div>

  <div class="card hide" id="play"></div>

  <div class="card" id="stats"></div>

  <div class="card">
    <div class="row">
      <button id="export">Download my progress</button>
      <button id="importBtn">Load progress</button>
      <input type="file" id="importFile" accept="application/json" class="hide">
      <button id="reset">Reset</button>
    </div>
    <p class="note">Progress is saved in this browser only. Download a backup to move it to another device.</p>
  </div>
</main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
